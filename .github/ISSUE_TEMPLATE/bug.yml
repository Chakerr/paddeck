name: Error / Bug
description: Algo no funciona como debería / Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué pasó / What happened
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir / Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de PadDeck y de Windows / PadDeck and Windows version
  - type: input
    id: obs
    attributes:
      label: Versión de OBS / OBS version
